# ---------------------------------------------------------------------------
# HyprWall — apply a day/night wallpaper preset at login
#
# Put this in ~/.config/hypr/hyprland.conf (classic Caelestia/hyprland config)
# and adjust the checkout path. The retry loop waits for the Caelestia shell.
# ---------------------------------------------------------------------------

exec-once = $HOME/Projects/kalender-wall/.venv/bin/hyprwall apply --retry 12 --retry-delay 2 >> $HOME/.cache/hyprwall/autostart.log 2>&1

# Notes
#  - `hyprwall apply` picks a light preset between 07:00 and 19:00, otherwise a
#    dark one, composites it to ~/.cache/current_wallpaper-<timestamp>.jpg and
#    calls `caelestia wallpaper -N -f <file>` (falling back to hyprpaper /
#    swww). Older compositions are deleted after every run.
#  - Check the log with:  tail -f ~/.cache/hyprwall/autostart.log
#  - Test manually with:  ~/Projects/kalender-wall/.venv/bin/hyprwall apply --dry-run
